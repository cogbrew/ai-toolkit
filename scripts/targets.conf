# 도구별 전역 경로 표. scripts/install_ai-toolkit.sh 가 읽는다.
#   enabled     : false 면 이 도구는 연결하지 않는다
#   skills      : 이 폴더 안에 스킬을 하나씩 링크한다(폴더 전체는 링크하지 않는다)
#   instruction : 이 경로에 ai-agents/AGENTS.md 를 링크한다(비우면 지침은 연결하지 않는다)
#   dir         : ai-agents/<dir>/skills/ 의 도구 전용 스킬을 이 도구에만 연결한다
#   reserved    : 이 도구가 쓰는 예약 이름(쉼표로 구분). 같은 이름의 스킬은 연결하지 않는다
#   checked     : 공식 문서로 경로를 확인한 날짜
# 경로의 앞 ~ 는 홈 폴더로 바꿔 읽는다.

[claude-code]
enabled     = true
skills      = ~/.claude/skills
instruction = ~/.claude/CLAUDE.md
dir         = claude
reserved    = synced
checked     = 2026-11

[codex]
enabled     = true
skills      = ~/.agents/skills
instruction = ~/.codex/AGENTS.md
dir         = codex
reserved    =
checked     = 2026-11

[antigravity]
enabled     = true
skills      = ~/.gemini/config/skills
instruction =
dir         = antigravity
reserved    =
checked     = 2026-11
# 지침 파일은 전역 규칙 파일 이름을 확인하지 못해 비워 둔다.
